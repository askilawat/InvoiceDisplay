<!DOCTYPE html>
<html>
<head>
    <title>Invoice System</title>
    <link rel="stylesheet" type="text/css" href="styles.css">
</head>
<body>
    <h1>Invoice System</h1>
    
    <div class="container">
        <h2>Invoices List</h2>
        <div id="invoices-table-container">
            <table class="invoices-list-table">
                <thead>
                    <tr>
                        <th>ID</th>
                        <th>Customer Name</th>
                        <th>Total Price</th>
                        <th>Date & Time</th>
                        <th>Actions</th>
                    </tr>
                </thead>
                <tbody id="invoices-tbody">
                    <!-- Invoices will load here -->
                </tbody>
            </table>
        </div>

        <div class="action-buttons">
            <button onclick="showCreateInvoiceForm()" class="btn-primary">Add New Invoice</button>
            <button onclick="showAddItemForm()" class="btn-primary">Add Item</button>
        </div>

        <div id="create-invoice-section" style="display:none;">
            <h3>Create New Invoice</h3>
            <div class="form-group">
                <label>Customer Name:</label>
                <input type="text" id="customer-name" placeholder="Enter customer name" required>
            </div>
            <div class="form-group">
                <label>Contact:</label>
                <input type="text" id="customer-contact" placeholder="Email or phone">
            </div>
            <div class="form-group">
                <label>Address:</label>
                <input type="text" id="customer-address" placeholder="Customer address">
            </div>
            <div class="form-group">
                <label>Select Item:</label>
                <select id="item-select">
                    <option value="">-- Select Item --</option>
                </select>
            </div>
            <div class="form-group">
                <label>Quantity:</label>
                <input type="number" id="item-quantity" placeholder="1" value="1" min="1" step="1">
            </div>
            <button type="button" onclick="addItemToInvoiceList()" class="btn-primary">Add Item</button>
            <div id="selected-items-list" style="margin:15px 0;">
                <strong>Selected Items:</strong>
                <ul id="selected-items-ul" style="list-style:none; padding:0; margin-top:10px;"></ul>
            </div>
            <button onclick="createInvoice()">Create Invoice</button>
            <button onclick="hideCreateInvoiceForm()" class="btn-cancel">Cancel</button>
            <div id="create-message"></div>
        </div>

        <div id="add-item-section" style="display:none;">
            <h3>Add New Item to Catalog</h3>
            <div class="form-group">
                <label>Item Name:</label>
                <input type="text" id="item-name" placeholder="Enter item name">
            </div>
            <div class="form-group">
                <label>Price:</label>
                <input type="number" id="item-price" placeholder="0.00" step="0.01">
            </div>
            <button onclick="addItemToCatalog()">Add Item</button>
            <button onclick="hideAddItemForm()" class="btn-cancel">Cancel</button>
            <div id="item-message"></div>
        </div>

        <div id="edit-invoice-section" style="display:none;">
            <h3>Edit Invoice #<span id="edit-invoice-number"></span></h3>
            <div class="form-group">
                <label>Customer Name:</label>
                <input type="text" id="edit-customer-name" placeholder="Enter customer name">
            </div>
            <div class="form-group">
                <label>Contact:</label>
                <input type="text" id="edit-customer-contact" placeholder="Email or phone">
            </div>
            <div class="form-group">
                <label>Address:</label>
                <input type="text" id="edit-customer-address" placeholder="Customer address">
            </div>
            <div class="form-group">
                <label>Select Item:</label>
                <select id="edit-item-select">
                    <option value="">-- Select Item --</option>
                </select>
            </div>
            <div class="form-group">
                <label>Quantity:</label>
                <input type="number" id="edit-item-quantity" placeholder="1" value="1" min="1" step="1">
            </div>
            <button type="button" onclick="addItemToEditList()" class="btn-primary">Add Item</button>
            <div id="edit-selected-items-list" style="margin:15px 0;">
                <strong>Current Items:</strong>
                <ul id="edit-selected-items-ul" style="list-style:none; padding:0; margin-top:10px;"></ul>
            </div>
            <input type="hidden" id="edit-invoice-id">
            <button onclick="updateInvoice()">Update Invoice</button>
            <button onclick="hideEditForm()" class="btn-cancel">Cancel</button>
            <div id="edit-message"></div>
        </div>

        <div id="view-invoice-section" style="display:none;">
            <h3>Invoice Details</h3>
            <div id="view-invoice-content">
                <!-- Invoice details will load here -->
            </div>
            <button onclick="hideViewForm()" class="btn-cancel">Close</button>
        </div>
    </div>
    
    <script src="script.js"></script>
</body>
</html>
